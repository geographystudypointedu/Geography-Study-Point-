<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Geo Study Point</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .glass-box {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
        }
        body { user-select: none; -webkit-user-select: none; }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-100 via-teal-50 to-cyan-100 min-h-screen flex flex-col items-center justify-center p-4" oncontextmenu="return false;">

    <!-- GTranslate -->
    <div class="gtranslate_wrapper fixed top-4 left-4 z-50"></div>
    <script>window.gtranslateSettings = {"default_language":"en","detect_browser_language":true,"wrapper_selector":".gtranslate_wrapper"};</script>
    <script src="https://cdn.gtranslate.net/latest/lc.js" defer></script>

    <div class="glass-box p-8 md:p-10 rounded-[2.5rem] w-full max-w-md text-center relative z-10 transform transition-all hover:scale-[1.02]">
        
        <div class="bg-white w-24 h-24 mx-auto rounded-full flex items-center justify-center mb-6 shadow-lg border-4 border-blue-100">
            <span class="text-5xl">🌍</span>
        </div>
        
        <h1 class="text-3xl font-extrabold text-slate-800 tracking-tight">Geo Study Point</h1>
        <p class="text-sm text-slate-500 font-bold mt-2 mb-8">AI-Powered Geography Examination Portal</p>

        <!-- Secure Firebase Google Login Button -->
        <button onclick="loginWithGoogle()" class="w-full bg-white text-slate-700 font-bold py-3.5 px-4 rounded-xl shadow-md border border-slate-200 hover:bg-slate-50 hover:shadow-lg transition-all flex items-center justify-center gap-3">
            <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google" class="w-6 h-6">
            <span>Secure Login with Google</span>
        </button>

        <p class="text-[10px] text-slate-400 font-bold mt-6 uppercase tracking-wide flex items-center justify-center gap-1">
            <span>🔒</span> Secured by Firebase & Supabase
        </p>
    </div>

    <footer class="fixed bottom-4 text-center text-xs font-bold text-slate-600">
        Developed & Engineered by <span class="text-indigo-700">Mr. Swastik Halder</span>
    </footer>

    <script>
        // Hybrid Auth Logic Placeholder (Firebase -> Supabase -> Dashboard)
        function loginWithGoogle() {
            const btn = document.querySelector('button');
            btn.innerHTML = `<span class="animate-pulse">Authenticating with Firebase...</span>`;
            
            setTimeout(() => {
                // Developer will add Firebase Auth Code here
                window.location.href = "dashboard.html";
            }, 1500);
        }
    </script>
</body>
</html>
