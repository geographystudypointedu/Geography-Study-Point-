<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Student Dashboard - Geo Study Point</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { min-width: 250px; background-color: #f8fafc; }
        .glow-box-emerald { background: #fff; border: 2px solid rgba(16,185,129,0.4); border-radius: 1.5rem; box-shadow: 0 0 10px rgba(16,185,129,0.2); }
        .glow-box-blue { background: #fff; border: 2px solid rgba(59,130,246,0.4); border-radius: 1.5rem; box-shadow: 0 0 10px rgba(59,130,246,0.2); }
        .glow-box-teal { background: #fff; border: 2px solid rgba(20,184,166,0.4); border-radius: 1.5rem; box-shadow: 0 0 10px rgba(20,184,166,0.2); }
        @keyframes scroll-left { 0% { transform: translateX(100vw); } 100% { transform: translateX(-100%); } }
        .animate-marquee { display: inline-block; white-space: nowrap; animation: scroll-left 20s linear infinite; }
    </style>
</head>
<body class="min-h-screen flex flex-col font-sans text-slate-800 relative overflow-x-hidden">

    <div class="w-full bg-[#4285F4] text-white text-[9px] sm:text-xs font-bold py-1.5 overflow-hidden fixed top-0 z-[150] border-b border-blue-700">
        <div class="animate-marquee">🚀 Welcome to Student Dashboard! 🌟 Military-Grade Security & AI Mentorship. 🎓</div>
    </div>

    <!-- 🚀 Floating Beta Version Badge -->
    <div class="fixed top-10 sm:top-12 left-1/2 transform -translate-x-1/2 z-[998] bg-slate-900/90 text-emerald-400 border border-emerald-500 px-3 py-1 sm:px-4 sm:py-1.5 rounded-full text-[9px] sm:text-[10px] font-black uppercase flex items-center gap-1.5 w-max">
        Beta 0.1
    </div>

    <!-- 🌍 Premium GTranslate -->
    <div class="fixed top-8 right-2 sm:top-10 sm:right-6 z-[999] bg-white/90 border border-slate-200 rounded-full px-2 py-1 sm:px-4 sm:py-2 flex items-center gap-2">
        <span class="text-indigo-600 text-sm"><i class="fa-solid fa-language"></i></span>
        <div class="gtranslate_wrapper"></div>
    </div>
    <script>window.gtranslateSettings = { "default_language": "en", "languages": ["en", "bn", "hi"], "wrapper_selector": ".gtranslate_wrapper" };</script>
    <script src="https://cdn.gtranslate.net/latest/lc.js" defer></script>

    <div class="container mx-auto px-2 sm:px-6 lg:px-8 pt-20 sm:pt-24 pb-8 w-full max-w-[100rem] flex-grow flex flex-col items-center">
        
        <div class="bg-indigo-50 p-3 sm:p-5 rounded-full mb-2 sm:mb-4 border border-indigo-200"><span class="text-3xl sm:text-6xl">🎓</span></div>
        <h1 class="text-lg sm:text-4xl font-extrabold text-slate-900 text-center tracking-tight">Student Portal</h1>
        <p class="text-[10px] sm:text-base text-slate-500 text-center mt-1 sm:mt-2 mb-6 sm:mb-10 font-bold max-w-3xl">Take exams, download marksheets, or chat with AI.</p>

        <div class="w-full grid grid-cols-1 lg:grid-cols-2 gap-4 xl:gap-8 2xl:gap-12">
            <!-- 📝 1. Exam Section -->
            <div class="glow-box-emerald p-4 sm:p-8 flex flex-col h-full">
                <h3 class="text-[10px] sm:text-sm font-extrabold text-emerald-700 uppercase mb-4 bg-emerald-50 py-2 sm:py-3 rounded-xl text-center">📝 Exam Center</h3>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mt-auto">
                    <button onclick="window.location.href='exam.html'" class="bg-emerald-500 text-white font-bold py-3 sm:py-4 rounded-xl shadow-md text-xs sm:text-sm">MCQ Exam</button>
                    <button onclick="window.location.href='subjective_exam.html'" class="bg-emerald-600 text-white font-bold py-3 sm:py-4 rounded-xl shadow-md text-xs sm:text-sm">Subjective Exam</button>
                </div>
            </div>

            <!-- 📊 2. Result Section -->
            <div class="glow-box-blue p-4 sm:p-8 flex flex-col h-full">
                <h3 class="text-[10px] sm:text-sm font-extrabold text-blue-700 uppercase mb-4 bg-blue-50 py-2 sm:py-3 rounded-xl text-center">📊 Download Result</h3>
                <div class="space-y-3 mt-auto">
                    <select id="classSelect" class="w-full p-2.5 sm:p-4 rounded-xl border border-slate-200 text-xs sm:text-sm bg-slate-50"><option value="">-- Select Class --</option><option value="12">Class 12</option></select>
                    <input type="text" id="uniqueId" placeholder="Enter ID" class="w-full p-2.5 sm:p-4 rounded-xl border border-slate-200 text-xs sm:text-sm bg-slate-50 uppercase">
                    <button onclick="window.location.href='result.html'" class="w-full bg-blue-600 text-white font-bold py-3 sm:py-4 rounded-xl shadow-md text-xs sm:text-sm">Fetch Marksheet</button>
                </div>
            </div>
        </div>
    </div>
    <script src="security.js"></script>
</body>
</html>
